# Publishes the package to the public npm registry (npmjs.com) whenever a
# GitHub Release is published — using npm Trusted Publishing (OIDC).
#
# No npm token is involved: GitHub mints a short-lived OIDC identity for this
# workflow run, and npm trusts it. Nothing to rotate, nothing to expire, and
# npm attaches build provenance automatically.
#
# ------------------------------------------------------------------------------
# ONE-TIME SETUP (required before this works):
#
# 1. Bootstrap: the package must exist on npm before a trusted publisher can be
#    configured. Publish the current version ONCE from your machine:
#        npm login
#        npm publish
#    (With account 2FA off this needs no OTP. This claims the name and puts
#    0.5.0 on npm.)
#
# 2. On npmjs.com, open the package -> Settings -> "Trusted Publisher" and add:
#        Publisher:            GitHub Actions
#        Organization / user:  nimacodes
#        Repository:           homebridge-systemair-vr700
#        Workflow filename:    npm-publish.yml
#        Environment:          (leave empty)
#
# 3. (Cleanup) Delete the now-unused NPM_TOKEN repo secret and revoke the token
#    on npm. This workflow no longer uses it.
#
# From then on: bump "version" in package.json, publish a GitHub Release whose
# tag matches (e.g. v0.6.0), and this workflow publishes it — no token needed.
# ------------------------------------------------------------------------------
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required: lets GitHub mint the OIDC token npm trusts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Guard: the release tag must match package.json's version, so we never
      # publish a mismatched or already-published version by accident.
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "release tag (without leading v): $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'. Bump the version in package.json to match the release tag."
            exit 1
          fi

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; ensure it.
      - run: npm install -g npm@latest
      - run: npm ci
      # No NODE_AUTH_TOKEN: auth happens via OIDC. Provenance is automatic.
      - run: npm publish
